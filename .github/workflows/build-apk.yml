name: Build and sign APK

# Builds pideploy.apk from the pinned upstream base and signs it with the
# project release keystore.  The keystore is stored in repository secrets so
# every run produces the same signing certificate, which is required for
# Android to accept the APK as an update ("App not installed" otherwise).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
#
# See README.md ("APK signing in GitHub Actions") for setup instructions.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (e.g. 3.2.9)"
        required: true
        default: "3.2.9"
      version_code:
        description: "versionCode (integer, must increase every release)"
        required: true
        default: "323"
      source_path:
        description: "Default disk image URL stored in the APK"
        required: false
        default: "https://github.com/NRXQuantum/Pi-hole-for-Android/releases/latest/download/raspbian32.tgz"
      publish_release:
        description: "Create/update a GitHub release for v<versionName> with the APK"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      SOURCE_PATH: ${{ inputs.source_path }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SIGNER_SHA256: 8e4a48e0122714043968bba9552eba599d1d787e49f21beb6b335e99262fb8eb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android build-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/35.0.0"
          if [ ! -x "$BT/apksigner" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
            fi
            [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "build-tools;35.0.0" >/dev/null
          fi
          [ -x "$BT/apksigner" ] || { echo "::error::build-tools 35 not available"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          "$BT/aapt2" version

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set"; missing=1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::secret ANDROID_KEYSTORE_PASSWORD is not set"; missing=1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::secret ANDROID_KEY_ALIAS is not set"; missing=1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "::error::secret ANDROID_KEY_PASSWORD is not set"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "See README.md -> APK signing in GitHub Actions"; exit 1; }

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore OK, alias $ANDROID_KEY_ALIAS found"

      - name: Build and sign
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh
        env:
          OUT_DIR: dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pideploy-${{ inputs.version_name }}
          path: |
            dist/pideploy.apk
            dist/pideploy.apk.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version_name }}
        run: |
          if [ -f "docs/releases/$TAG.md" ]; then
            NOTES="docs/releases/$TAG.md"
          else
            NOTES="$RUNNER_TEMP/notes.md"
            {
              echo "## Pi-hole for Android $TAG"
              echo
              echo "Signed APK built from commit \`$GITHUB_SHA\`."
              echo
              echo "APK SHA-256: \`$(cut -d' ' -f1 dist/pideploy.apk.sha256)\`"
              echo "Signer SHA-256: \`$(sed -n 's/^signerSha256=//p' dist/build-info.txt)\`"
            } > "$NOTES"
          fi
          files=(dist/pideploy.apk dist/pideploy.apk.sha256 dist/build-info.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Pi-hole for Android $TAG" \
              --notes-file "$NOTES" \
              --latest
          fi
